<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Fighter II</title>
<style>
body { margin:0; background:#111; overflow:hidden; touch-action:none; }
canvas { display:block; image-rendering: pixelated; }

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn {
  width:60px;
  height:60px;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 10px rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="jump">⬆</div>
  </div>
  <div>
    <div class="btn" id="punch">👊</div>
    <div class="btn" id="kick">🦵</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 360;
canvas.height = 240;

const SCALE = 3;
ctx.scale(SCALE, SCALE);

const gravity = 0.5;
const ground = 180;

function createFighter(x, color){
  return {
    x:x,
    y:ground,
    vy:0,
    color:color,
    state:"idle",
    frame:0,
    facing:1,
    health:100
  };
}

let player = createFighter(50,"#00d8ff");
let enemy = createFighter(200,"#ff3c3c");

let moveLeft=false, moveRight=false;

function bind(id, press, release){
  const b=document.getElementById(id);
  b.addEventListener("touchstart",e=>{e.preventDefault();press();});
  b.addEventListener("touchend",e=>{e.preventDefault();release();});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
}

bind("left",()=>{moveLeft=true;player.facing=-1;},()=>moveLeft=false);
bind("right",()=>{moveRight=true;player.facing=1;},()=>moveRight=false);
bind("jump",()=>{if(player.y===ground) player.vy=-8;},()=>{});
bind("punch",()=>{player.state="punch";player.frame=0;},()=>{});
bind("kick",()=>{player.state="kick";player.frame=0;},()=>{});

function update(){

  if(moveLeft) player.x-=2;
  if(moveRight) player.x+=2;

  player.vy+=gravity;
  player.y+=player.vy;
  if(player.y>ground){ player.y=ground; player.vy=0; }

  // simple animation timing
  player.frame++;
  if(player.frame>20){
    player.state="idle";
    player.frame=0;
  }

  // basic enemy AI
  enemy.facing = player.x < enemy.x ? -1 : 1;
  if(Math.abs(player.x-enemy.x)>40){
    enemy.x += player.x<enemy.x ? -1 : 1;
  }
}

function drawPixelFighter(f){

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing,1);

  ctx.fillStyle=f.color;

  // torso
  ctx.fillRect(-4,-16,8,16);

  // head
  ctx.fillRect(-3,-22,6,6);

  // legs
  ctx.fillRect(-4,0,3,8);
  ctx.fillRect(1,0,3,8);

  // arms based on state
  if(f.state==="punch"){
    ctx.fillRect(4,-14,6,3);
  } else if(f.state==="kick"){
    ctx.fillRect(4,0,8,3);
  } else {
    ctx.fillRect(4,-12,4,3);
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background floor
  ctx.fillStyle="#333";
  ctx.fillRect(0, ground+8, canvas.width, 40);

  drawPixelFighter(player);
  drawPixelFighter(enemy);

  // health bars
  ctx.fillStyle="lime";
  ctx.fillRect(10,10,player.health,5);
  ctx.fillRect(150,10,enemy.health,5);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
