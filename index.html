
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Street Fighter Style 512</title>
<style>
html,body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}
canvas{
    image-rendering:pixelated;
    background:#0f1022;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 512;
const H = 288;

canvas.width = W;
canvas.height = H;
ctx.imageSmoothingEnabled = false;

function resize(){
    const aspect = W/H;
    let w = window.innerWidth;
    let h = window.innerHeight;
    if(w/h > aspect) w = h*aspect;
    else h = w/aspect;
    canvas.style.width = w+"px";
    canvas.style.height = h+"px";
}
window.addEventListener("resize",resize);
resize();

const ground = 230;

function Fighter(x,color){
    this.x = x;
    this.y = ground;
    this.color = color;
    this.facing = 1;
    this.health = 100;
    this.state = "idle";
    this.frame = 0;
}

let p = new Fighter(140,"#45e6ff");
let e = new Fighter(380,"#ff6262");

let keys = {};
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

let hitFlash = 0;

function update(){

    if(keys["ArrowLeft"]){ p.x -= 4; p.facing = -1; }
    if(keys["ArrowRight"]){ p.x += 4; p.facing = 1; }

    if(keys["z"]) p.state="punch";
    else if(keys["x"]) p.state="kick";
    else p.state="idle";

    if(p.state==="punch" && Math.abs(p.x-e.x)<50){
        e.health -= 0.3;
        hitFlash = 3;
    }

    if(p.state==="kick" && Math.abs(p.x-e.x)<70){
        e.health -= 0.4;
        hitFlash = 4;
    }

    p.frame++;
}

function drawOutlineRect(x,y,w,h){
    ctx.fillStyle="black";
    ctx.fillRect(x-2,y-2,w+4,h+4);
}

function drawFighter(f){

    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.scale(f.facing,1);

    let bounce = Math.sin(performance.now()/150)*3;

    // HEAD
    drawOutlineRect(-14,-80+bounce,28,28);
    ctx.fillStyle="#ffe0bd";
    ctx.fillRect(-14,-80+bounce,28,28);

    // TORSO
    drawOutlineRect(-20,-52+bounce,40,50);
    ctx.fillStyle=f.color;
    ctx.fillRect(-20,-52+bounce,40,50);

    // LEGS
    drawOutlineRect(-18,-2,16,40);
    drawOutlineRect(2,-2,16,40);
    ctx.fillStyle=f.color;
    ctx.fillRect(-18,-2,16,40);
    ctx.fillRect(2,-2,16,40);

    // ARMS (EXAGGERATED)
    if(f.state==="punch"){
        drawOutlineRect(22,-48+bounce,38,14);
        ctx.fillStyle=f.color;
        ctx.fillRect(22,-48+bounce,38,14);
    }
    else if(f.state==="kick"){
        drawOutlineRect(18,8,52,14);
        ctx.fillStyle=f.color;
        ctx.fillRect(18,8,52,14);
    }
    else{
        drawOutlineRect(20,-48+bounce,18,14);
        ctx.fillStyle=f.color;
        ctx.fillRect(20,-48+bounce,18,14);
    }

    ctx.restore();
}

function draw(){

    if(hitFlash>0){
        ctx.fillStyle="white";
        ctx.fillRect(0,0,W,H);
        hitFlash--;
    } else {
        ctx.fillStyle="#1b1f4b";
        ctx.fillRect(0,0,W,H);
    }

    // ground
    ctx.fillStyle="#2f2f2f";
    ctx.fillRect(0,ground+20,W,40);

    drawFighter(p);
    drawFighter(e);

    // health bars
    ctx.fillStyle="lime";
    ctx.fillRect(30,30,p.health*2,12);
    ctx.fillStyle="red";
    ctx.fillRect(W-230,30,e.health*2,12);
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
