<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PIXEL FIGHTER ULTRA</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  image-rendering: pixelated;
  background: #111;
}

.controls {
  position: fixed;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}

.btn {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #222;
  color: white;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px rgba(255,255,255,0.4);
}

#rotateWarning {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  font-size: 20px;
  text-align: center;
  z-index: 100;
}
</style>
</head>
<body>

<div id="rotateWarning">ROTATE DEVICE<br>LANDSCAPE MODE REQUIRED</div>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="jump">⬆</div>
  </div>
  <div>
    <div class="btn" id="punch">👊</div>
    <div class="btn" id="kick">🦵</div>
    <div class="btn" id="fire">🔥</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const BASE_WIDTH = 384;
const BASE_HEIGHT = 224;

canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

function resizeCanvas() {
  const aspect = BASE_WIDTH / BASE_HEIGHT;
  let w = window.innerWidth;
  let h = window.innerHeight;

  if (w / h > aspect) {
    w = h * aspect;
  } else {
    h = w / aspect;
  }

  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function checkOrientation() {
  const warning = document.getElementById("rotateWarning");
  if (window.innerWidth < window.innerHeight) {
    warning.style.display = "flex";
  } else {
    warning.style.display = "none";
  }
}

window.addEventListener("resize", checkOrientation);
checkOrientation();

ctx.imageSmoothingEnabled = false;

const gravity = 0.5;
const ground = 170;

let player = { x:60, y:ground, vy:0, facing:1, health:100 };
let enemy  = { x:240, y:ground, health:100 };

let moveLeft=false, moveRight=false;

function bind(id, press, release){
  const b=document.getElementById(id);
  b.addEventListener("touchstart",e=>{e.preventDefault();press();});
  b.addEventListener("touchend",e=>{e.preventDefault();release();});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
}

bind("left",()=>{moveLeft=true;player.facing=-1;},()=>moveLeft=false);
bind("right",()=>{moveRight=true;player.facing=1;},()=>moveRight=false);
bind("jump",()=>{if(player.y===ground) player.vy=-9;},()=>{});

function update(){
  if(moveLeft) player.x-=2;
  if(moveRight) player.x+=2;

  player.vy+=gravity;
  player.y+=player.vy;
  if(player.y>ground){ player.y=ground; player.vy=0; }

  if(Math.abs(player.x-enemy.x)>40){
    enemy.x += player.x<enemy.x ? -1 : 1;
  }
}

function drawFighter(f, color){
  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.scale(f.facing || 1,1);
  ctx.fillStyle=color;

  ctx.fillRect(-4,-16,8,16);
  ctx.fillRect(-3,-22,6,6);
  ctx.fillRect(-4,0,3,8);
  ctx.fillRect(1,0,3,8);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,BASE_WIDTH,BASE_HEIGHT);

  ctx.fillStyle="#1e1e1e";
  ctx.fillRect(0,ground+8,BASE_WIDTH,40);

  drawFighter(player,"#00d8ff");
  drawFighter(enemy,"#ff3c3c");

  ctx.fillStyle="lime";
  ctx.fillRect(10,10,player.health,6);
  ctx.fillRect(200,10,enemy.health,6);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
