<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PIXEL FIGHTER TURBO</title>
<style>
body { margin:0; background:black; overflow:hidden; touch-action:none; }
canvas { display:block; image-rendering: pixelated; }

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 6px rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="jump">⬆</div>
  </div>
  <div>
    <div class="btn" id="punch">👊</div>
    <div class="btn" id="kick">🦵</div>
    <div class="btn" id="fire">🔥</div>
    <div class="btn" id="super">💥</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 384;
canvas.height = 224;

const SCALE = 3;
ctx.scale(SCALE, SCALE);

const gravity = 0.5;
const ground = 170;

let freezeFrames = 0;
let roundIntro = 120;
let gameOver = false;

function createFighter(x,color){
  return {
    x:x,
    y:ground,
    vy:0,
    color:color,
    state:"idle",
    frame:0,
    facing:1,
    health:100,
    fireballs:[],
    combo:0,
    meter:0,
    win:false
  };
}

let player = createFighter(60,"#00d8ff");
let enemy = createFighter(240,"#ff3c3c");

let moveLeft=false, moveRight=false;

function bind(id, press, release){
  const b=document.getElementById(id);
  b.addEventListener("touchstart",e=>{e.preventDefault();press();});
  b.addEventListener("touchend",e=>{e.preventDefault();release();});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
}

bind("left",()=>{moveLeft=true;player.facing=-1;},()=>moveLeft=false);
bind("right",()=>{moveRight=true;player.facing=1;},()=>moveRight=false);
bind("jump",()=>{if(player.y===ground) player.vy=-9;},()=>{});
bind("punch",()=>{player.state="punch";player.frame=0;},()=>{});
bind("kick",()=>{player.state="kick";player.frame=0;},()=>{});
bind("fire",()=>{
  player.fireballs.push({x:player.x,y:player.y-10,v:4*player.facing});
},()=>{});
bind("super",()=>{
  if(player.meter>=100){
    player.fireballs.push({x:player.x,y:player.y-15,v:7*player.facing,super:true});
    player.meter=0;
  }
},()=>{});

function update(){

  if(roundIntro>0){ roundIntro--; return; }
  if(gameOver) return;
  if(freezeFrames>0){ freezeFrames--; return; }

  if(moveLeft) player.x-=2;
  if(moveRight) player.x+=2;

  player.vy+=gravity;
  player.y+=player.vy;
  if(player.y>ground){ player.y=ground; player.vy=0; }

  enemy.facing = player.x < enemy.x ? -1 : 1;
  if(Math.abs(player.x-enemy.x)>50){
    enemy.x += player.x<enemy.x ? -1 : 1;
  }

  player.fireballs.forEach(f=>{
    f.x += f.v;
    if(Math.abs(f.x-enemy.x)<10){
      let dmg = f.super ? 20 : 10;
      enemy.health-=dmg;
      player.combo++;
      player.meter+=10;
      freezeFrames=5;
    }
  });

  player.fireballs = player.fireballs.filter(f=>f.x>0 && f.x<384);

  if(Math.abs(player.x-enemy.x)<20){
    if(player.state==="punch"){
      enemy.health-=4;
      player.combo++;
      player.meter+=5;
      freezeFrames=4;
    }
    if(player.state==="kick"){
      enemy.health-=6;
      player.combo++;
      player.meter+=8;
      freezeFrames=6;
    }
  }

  player.frame++;
  if(player.frame>15){
    player.state="idle";
  }

  if(enemy.health<=0){
    gameOver=true;
    player.win=true;
  }
}

function drawFighter(f){

  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.scale(f.facing,1);
  ctx.fillStyle=f.color;

  let bob = (f.state==="idle") ? Math.sin(Date.now()/200)*1 : 0;

  if(f.win){
    ctx.fillRect(-4,-26,8,26);
    ctx.fillRect(-6,-32,12,6);
  } else {
    ctx.fillRect(-4,-16+bob,8,16);
    ctx.fillRect(-3,-22+bob,6,6);
  }

  ctx.fillRect(-4,0,3,8);
  ctx.fillRect(1,0,3,8);

  if(f.state==="punch"){
    ctx.fillRect(4,-14,6,3);
  } else if(f.state==="kick"){
    ctx.fillRect(4,0,8,3);
  } else {
    ctx.fillRect(4,-12,4,3);
  }

  ctx.restore();
}

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#1e1e1e";
  ctx.fillRect(0,ground+8,384,40);

  drawFighter(player);
  drawFighter(enemy);

  ctx.fillStyle="orange";
  player.fireballs.forEach(f=>{
    ctx.fillRect(f.x,f.y-5,f.super?10:6,f.super?10:6);
  });

  ctx.fillStyle="lime";
  ctx.fillRect(10,10,player.health,6);
  ctx.fillRect(200,10,enemy.health,6);

  ctx.fillStyle="cyan";
  ctx.fillRect(10,18,player.meter,4);

  ctx.fillStyle="white";
  ctx.font="8px monospace";
  ctx.fillText("COMBO: "+player.combo,10,30);

  if(roundIntro>0){
    ctx.font="20px monospace";
    ctx.fillText(roundIntro>60?"ROUND 1":"FIGHT!",120,100);
  }

  if(gameOver){
    ctx.font="20px monospace";
    ctx.fillText("YOU WIN",130,100);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
