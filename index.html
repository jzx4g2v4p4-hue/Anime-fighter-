<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Street Fighter Style - Animated</title>

<style>
body { margin:0; background:black; overflow:hidden; touch-action:none; }
canvas { display:block; }

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn {
  width:65px;
  height:65px;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 15px rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div>
    <div class="btn" id="punch">👊</div>
    <div class="btn" id="kick">🦵</div>
    <div class="btn" id="block">🛡</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight * 0.8;

const ground = canvas.height - 120;

let moveLeft=false, moveRight=false;

function createFighter(x, color){
  return {
    x:x,
    y:ground,
    color:color,
    health:100,
    state:"idle",
    frame:0,
    facing:1
  }
}

let player = createFighter(150,"cyan");
let enemy = createFighter(canvas.width-200,"crimson");

function bind(id, press, release){
  const b=document.getElementById(id);
  b.addEventListener("touchstart",e=>{e.preventDefault();press();});
  b.addEventListener("touchend",e=>{e.preventDefault();release();});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
}

bind("left",()=>{moveLeft=true;player.facing=-1;},()=>moveLeft=false);
bind("right",()=>{moveRight=true;player.facing=1;},()=>moveRight=false);

bind("punch",()=>{player.state="punch";player.frame=0;},()=>{});
bind("kick",()=>{player.state="kick";player.frame=0;},()=>{});
bind("block",()=>{player.state="block";},()=>{player.state="idle";});

function update(){

  if(moveLeft) player.x-=5;
  if(moveRight) player.x+=5;

  // simple AI
  enemy.facing = player.x < enemy.x ? -1 : 1;

  if(Math.abs(player.x-enemy.x)>120){
    enemy.x += player.x<enemy.x ? -2 : 2;
  }

  if(player.state==="punch" || player.state==="kick"){
    player.frame++;
    if(player.frame>15){
      player.state="idle";
    }
  }
}

function drawFighter(f){

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing,1);

  ctx.strokeStyle=f.color;
  ctx.lineWidth=6;

  // head
  ctx.beginPath();
  ctx.arc(0,-80,20,0,Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.moveTo(0,-60);
  ctx.lineTo(0,0);
  ctx.stroke();

  // arms
  if(f.state==="punch"){
    ctx.beginPath();
    ctx.moveTo(0,-50);
    ctx.lineTo(60,-40);
    ctx.stroke();
  } else if(f.state==="block"){
    ctx.beginPath();
    ctx.moveTo(0,-50);
    ctx.lineTo(30,-70);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(0,-50);
    ctx.lineTo(30,-20);
    ctx.stroke();
  }

  // legs
  if(f.state==="kick"){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(70,20);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(25,60);
    ctx.stroke();
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawFighter(player);
  drawFighter(enemy);

  ctx.fillStyle="lime";
  ctx.fillRect(20,20,player.health*2,15);
  ctx.fillRect(canvas.width-220,20,enemy.health*2,15);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
