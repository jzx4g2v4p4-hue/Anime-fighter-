<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ultimate Anime Fighter - Animated</title>

<style>
body { margin:0; background:black; overflow:hidden; font-family:sans-serif; touch-action:none; }
canvas { display:block; }

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn {
  width:70px;
  height:70px;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 15px rgba(255,255,255,0.3);
  user-select:none;
}

#characterSelect {
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.charBox {
  padding:20px;
  margin:15px;
  border:2px solid white;
  width:240px;
  text-align:center;
}
</style>
</head>
<body>

<div id="characterSelect">
<h1>Select Your Fighter</h1>
<div class="charBox" data-char="eric">⚡ Eric</div>
<div class="charBox" data-char="jairo">🔥 Jairo</div>
<div class="charBox" data-char="chris">🧠 Chris</div>
<div class="charBox" data-char="greg">💥 Greg</div>
</div>

<canvas id="game"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div>
    <div class="btn" id="punch">👊</div>
    <div class="btn" id="kick">🦵</div>
    <div class="btn" id="block">🛡</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight * 0.8;

const ground = canvas.height - 200;

let player, enemy;
let selectedType=null;
let moveLeft=false, moveRight=false;
let timer=60;
let gameStarted=false;

function createFighter(x,color){
  return {
    x:x,
    y:ground,
    width:100,
    height:180,
    color:color,
    health:100,
    state:"idle",
    stateTimer:0,
    blocking:false
  };
}

document.querySelectorAll(".charBox").forEach(box=>{
  box.addEventListener("click", ()=>{
    selectedType = box.dataset.char;
    document.getElementById("characterSelect").style.display="none";
    startGame();
  });
});

function startGame(){
  player = createFighter(100,"cyan");
  enemy = createFighter(canvas.width-200,"crimson");
  gameStarted=true;
  loop();
}

function bind(id, press, release){
  const b=document.getElementById(id);
  b.addEventListener("touchstart",e=>{e.preventDefault();press();});
  b.addEventListener("touchend",e=>{e.preventDefault();release();});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
}

bind("left",()=>moveLeft=true,()=>moveLeft=false);
bind("right",()=>moveRight=true,()=>moveRight=false);

bind("punch",()=>{
  player.state="punch";
  player.stateTimer=15;
},()=>{});

bind("kick",()=>{
  player.state="kick";
  player.stateTimer=20;
},()=>{});

bind("block",()=>{
  player.blocking=true;
  player.state="block";
},()=>{
  player.blocking=false;
  player.state="idle";
});

setInterval(()=>{ if(gameStarted) timer--; },1000);

function update(){

  if(moveLeft) player.x-=5;
  if(moveRight) player.x+=5;

  if(player.stateTimer>0){
    player.stateTimer--;
    if(player.stateTimer<=0 && !player.blocking){
      player.state="idle";
    }
  }

  // Simple enemy AI
  if(Math.abs(enemy.x-player.x)>120){
    enemy.x += (player.x<enemy.x?-2:2);
  } else {
    if(Math.random()<0.02){
      enemy.state="punch";
      enemy.stateTimer=15;
      if(!player.blocking){
        player.health-=5;
      }
    }
  }

  if(enemy.stateTimer>0){
    enemy.stateTimer--;
    if(enemy.stateTimer<=0){
      enemy.state="idle";
    }
  }

  // Player attack damage
  if(player.state==="punch" && Math.abs(player.x-enemy.x)<120){
    enemy.health-=2;
  }
  if(player.state==="kick" && Math.abs(player.x-enemy.x)<140){
    enemy.health-=3;
  }
}

function drawFighter(f){

  ctx.save();

  if(f.state==="block"){
    ctx.fillStyle="gray";
  } else if(f.state==="punch"){
    ctx.fillStyle="yellow";
  } else if(f.state==="kick"){
    ctx.fillStyle="orange";
  } else {
    ctx.fillStyle=f.color;
  }

  ctx.fillRect(f.x,f.y,f.width,f.height);

  // Arms / Legs animation shapes
  if(f.state==="punch"){
    ctx.fillRect(f.x+f.width, f.y+40, 40, 20);
  }

  if(f.state==="kick"){
    ctx.fillRect(f.x+f.width, f.y+120, 60, 20);
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawFighter(player);
  drawFighter(enemy);

  ctx.fillStyle="lime";
  ctx.fillRect(20,20,player.health*2,20);
  ctx.fillRect(canvas.width-220,20,enemy.health*2,20);

  ctx.fillStyle="white";
  ctx.font="28px Arial";
  ctx.fillText(timer,canvas.width/2-10,40);

  if(player.health<=0 || enemy.health<=0 || timer<=0){
    ctx.font="60px Arial";
    ctx.fillText("K.O.",canvas.width/2-70,canvas.height/2);
  }
}

function loop(){
  if(!gameStarted) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
